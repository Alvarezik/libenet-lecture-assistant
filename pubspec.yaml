name: libenet_lecture_assistant
description: "LibeNetLA - LibeNet Lecture Assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.3.0
  http_parser: ^4.0.2
  shared_preferences: ^2.3.5
  record: 5.1.2
  audioplayers: ^6.1.1
  path_provider: ^2.1.5
  file_picker: ^8.1.7
  intl: ^0.20.2
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  share_plus: ^10.1.4
  permission_handler: ^11.3.1
  record_linux: 0.7.1
  record_platform_interface: 1.1.0
  flutter_local_notifications: ^19.5.0
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/


